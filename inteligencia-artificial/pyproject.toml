[project]
name = "inteligencia-artificial"
version = "0.1.0"
description = "Exercícios e projetos da disciplina de Inteligência Artificial"
authors = [
    {name = "wvxbs",email = "gabriel.ferreira7854@gmail.com"}
]
requires-python = ">=3.13,<3.14"
dependencies = ["networkx (>=3.6.1,<4.0.0)", "matplotlib (>=3.11.1,<4.0.0)", "ipywidgets (>=8.1.9,<9.0.0)", "lxml (>=6.1.3,<7.0.0)", "scikit-learn (>=1.9.1,<2.0.0)", "pandas (>=3.0.5,<4.0.0)", "seaborn (>=0.13.2,<0.14.0)", "statsmodels (>=0.15.0,<0.16.0)", "python-docx (>=1.2.0,<2.0.0)", "pandas-stubs (>=3.0.5,<3.1.0)", "scipy-stubs (>=1.18.1,<1.19.0)", "numpy (>=2.5.4,<3.0.0)", "ipython (>=9.17.1,<10.0.0)", "scipy (>=1.18.1,<2.0.0)", "joblib (>=1.6.0,<2.0.0)"]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "jupyterlab (>=4.6.3,<5.0.0)"
]
