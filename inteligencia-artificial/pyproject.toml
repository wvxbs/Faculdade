[project]
name = "inteligencia-artificial"
version = "0.1.0"
description = "Exercícios e projetos da disciplina de Inteligência Artificial"
authors = [
    {name = "wvxbs",email = "gabriel.ferreira7854@gmail.com"}
]
requires-python = ">=3.13,<3.14"
dependencies = ["networkx (>=3.6.1,<4.0.0)", "matplotlib (>=3.11.1,<4.0.0)", "ipywidgets (>=8.1.9,<9.0.0)", "lxml (>=6.1.3,<7.0.0)"]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "jupyterlab (>=4.6.3,<5.0.0)"
]
